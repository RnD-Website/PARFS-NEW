# Netlify deploys Next.js with its OpenNext adapter automatically (SSR, route
# handlers, image CDN). Do not pin @netlify/plugin-nextjs.
[build]
  command = "npm run build:netlify"   # Prisma client, migrations, idempotent catalogue seed, build
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Deploy previews: use a separate database (set DATABASE_URL for the
# "Deploy previews" context in the Netlify UI) so previews never migrate production.

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
