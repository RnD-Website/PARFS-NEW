# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gasenos
      POSTGRES_PASSWORD: gasenos
      POSTGRES_DB: gasenos
    ports:
      - "5432:5432"
    volumes:
      - gasenos-db:/var/lib/postgresql/data
volumes:
  gasenos-db:
